name: 네이버 블로그 → 홈페이지 자동 복사

on:
  schedule:
    - cron: "7 */3 * * *"      # 3시간마다 (UTC 기준 7분)
  workflow_dispatch:           # Actions 탭에서 'Run workflow' 로 바로 실행
  push:
    branches: [main]
    paths:
      - naver_auto.py
      - naver_sync.py
      - indexnow.py
      - gsc_sitemap.py
      - .github/workflows/naver-sync.yml

permissions:
  contents: write

concurrency:
  group: naver-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 새 글 가져오기
        run: |
          pip install --quiet truststore
          python naver_auto.py | tee sync.log

      - name: 홈페이지 다시 만들기
        run: python build.py

      - name: 빙·네이버에 새 글 알리기 (IndexNow)
        env:
          INDEXNOW_ALL: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python indexnow.py || true

      - name: 변경 사항 올리기
        id: commit
        run: |
          git config user.name "onviewlab-bot"
          git config user.email "onview.lab@gmail.com"
          git add -A posts blog index.html sitemap.xml robots.txt llms.txt feed.xml naver_synced.json
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "네이버 새 글 자동 복사 ($(grep -o 'NEW=[0-9]*' sync.log))"
            git push
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 구글에 사이트맵 다시 알리기 (서치콘솔)
        if: steps.commit.outputs.pushed == '1' || github.event_name != 'schedule'
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT || secrets.YOUR_SECRET_NAME }}
        run: |
          sleep 90   # GitHub Pages 에 새 글이 반영될 때까지 잠깐 기다림
          pip install --quiet google-auth requests
          python gsc_sitemap.py || true
